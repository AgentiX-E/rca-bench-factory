name: Fault extraction accuracy

# The M1 exit condition, measured.
#
# `docs/product.md` states the M1 exit condition in terms of extraction accuracy:
# the historical-fault channel (M13 channel B) must recover the fault type and
# category from an incident text at a strict all-fields rate of at least 70%.
# Until this workflow existed, that condition had no measurement behind it -- it
# was a claim in a document with nothing that could contradict it.
#
# ## Why this is on a runner and not in the sandbox
#
# The measurement needs a real LLM. A scoring run that substitutes a stub for the
# model measures the stub, so the number has to come from a real endpoint. A
# GitHub runner reaches every provider; the development sandbox reaches exactly
# one (see finding 55), and the workflow comments used to justify this by saying
# the sandbox "has internet access", which is not true.
#
# ## Why this is separate from CI
#
# It spends money and it is nondeterministic: the same commit can score 72% on
# one run and 68% on the next, because the model is not a pure function. A gate
# that can go red on an unchanged tree is worse than no gate, so this is not on
# `push`. It runs on a schedule and on demand, and it reports a figure rather
# than blocking a merge.
#
# ## The provider, and why this file does not name one
#
# This workflow used to reference `secrets.RCA_BENCH_LLM_API_KEY` -- a name this
# repository invented -- and the run failed because the organisation's existing
# key is stored under a different name. That was the wrong repair to ask for.
# The core package ships three interchangeable adapters behind one registry, and
# an abstraction that holds everywhere except the place a user configures is not
# an abstraction. So the workflow resolves the *provider* first, then maps the
# provider onto whichever secret the organisation already defined. Storing a
# second copy of a key under a second name is exactly the single-vendor coupling
# the registry exists to remove.
#
# To add a provider: add it to the registry in `packages/core/src/llm/registry.ts`
# and add one entry to the `PROVIDER_*` maps below. Nothing else in this file
# changes.
#
# ## The key
#
# Every provider's key is passed as an environment variable to the steps that
# need it. A key is never written to a file, never echoed (the check reports its
# *length*), and never reaches the artefact. `scripts/check-no-secrets.mjs` is
# the backstop; this comment is the statement of intent.
#
# ## The endpoint and the model
#
# Both are optional. Unset means the provider's own default, resolved inside the
# core package. The endpoint is *never* hard-coded here: pinning one vendor's URL
# in the workflow would reintroduce the single-vendor lock at the layer that is
# supposed to be provider-neutral.

on:
  workflow_dispatch:
    inputs:
      strict_threshold:
        description: Override the strict all-fields threshold (0..1); empty uses the code default
        required: false
        default: ''
        type: string
  schedule:
    # Fridays at 06:41 UTC. Weekly, off the hour, and on a different day from the
    # official-data anchor so the two long jobs do not contend for runners.
    - cron: '41 6 * * 5'

permissions:
  contents: read

concurrency:
  group: fault-extraction-accuracy
  cancel-in-progress: false

jobs:
  score:
    name: Derive and score extraction accuracy against the golden dataset
    runs-on: ubuntu-latest
    # Twenty samples, serialised with a 250ms gap, at a few seconds per call.
    # Bounded so a hung request fails the job instead of occupying a runner.
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (the scripts read core's dist)
        run: pnpm build

      # The dataset is checked before any request is spent.
      #
      # A malformed sample file would otherwise be discovered at scoring time --
      # after nineteen paid calls. `--help` is not enough for that; this step
      # parses the dataset through the same reader the scorer uses, so the run
      # fails in seconds rather than in dollars.
      - name: Validate the golden dataset before spending a request
        run: |
          set -eu
          node -e '
            const { readFileSync } = require("node:fs");
            import("./packages/core/dist/index.js").then((core) => {
              const ds = core.parseGoldenDataset(
                JSON.parse(readFileSync("golden-master/fault-extraction/samples.json", "utf8")),
              );
              console.log(`golden dataset: ${ds.samples.length} sample(s), schema ${ds.schema}`);
            });
          '

      # Which provider this run uses, resolved before anything is spent.
      #
      # Organisation-level variables, not repository ones: a provider choice is
      # an organisation-wide fact, and a second copy per repository is how the
      # two drift. An empty or absent value means the registry's default, which
      # is the provider this project's documented figures were produced against.
      #
      # The resolution runs through the same function the derivation script uses,
      # so a name that validates here cannot fail there. A workflow that
      # re-implements the rule would be a second, weaker copy of it.
      - name: Resolve the LLM provider
        id: provider
        env:
          RCA_BENCH_LLM_PROVIDER: ${{ vars.RCA_BENCH_LLM_PROVIDER }}
        run: |
          set -eu
          resolved=$(node -e '
            import("./packages/core/dist/index.js").then((core) => {
              const config = core.resolveLlmProviderConfig(process.env);
              if (!config.ok) {
                console.error(config.error);
                process.exit(1);
              }
              process.stdout.write(config.provider);
            });
          ') || {
            echo "::error title=Unknown LLM provider::RCA_BENCH_LLM_PROVIDER is set to an unregistered name. See the workflow header for how to add one."
            exit 1
          }
          echo "provider=${resolved}" >> "$GITHUB_OUTPUT"
          echo "resolved provider: ${resolved}"

      # The key, looked up by the provider that was just resolved.
      #
      # This is the step that used to fail. It demanded a secret name this
      # repository invented; the organisation stores its keys under vendor names,
      # so the run stopped on a missing secret that was not, in fact, missing.
      #
      # The three cases are handled explicitly because they need different
      # messages: a provider whose secret was never set, a provider with no
      # mapping at all (someone added it to the registry and not to this file),
      # and the normal path. Collapsing them into one "no key" error is how the
      # first version cost two runs to diagnose.
      - name: Select the key for the resolved provider
        id: key
        env:
          PROVIDER: ${{ steps.provider.outputs.provider }}
          # Each entry is the secret the organisation already defines for that
          # vendor. Adding a provider means adding one line here.
          KEY_DEEPSEEK: ${{ secrets.DEEPSEEK_API_KEY }}
          KEY_OPENAI: ${{ secrets.OPENAI_API_KEY }}
          KEY_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -eu
          case "$PROVIDER" in
            deepseek)  selected="${KEY_DEEPSEEK:-}" ;;
            openai)    selected="${KEY_OPENAI:-}" ;;
            anthropic) selected="${KEY_ANTHROPIC:-}" ;;
            *)
              echo "::error title=No key mapping::The registry resolved provider '${PROVIDER}', but this workflow has no secret mapped for it. Add one line to the 'Select the key' step."
              exit 1
              ;;
          esac
          if [ -z "$selected" ]; then
            echo "::error title=Missing LLM key::Provider '${PROVIDER}' is selected but its secret is empty. Set the matching organisation secret; the repository cannot score a run without one."
            exit 1
          fi
          # Written to the environment, never to a file, and only the length is
          # ever printed. It is masked for the rest of the job as a second belt.
          echo "::add-mask::${selected}"
          echo "RCA_BENCH_LLM_API_KEY=${selected}" >> "$GITHUB_ENV"
          echo "provider=${PROVIDER} has a key present (${#selected} characters; value never printed)"

      - name: Derive the extractions
        id: derive
        env:
          RCA_BENCH_LLM_PROVIDER: ${{ steps.provider.outputs.provider }}
          RCA_BENCH_LLM_BASE_URL: ${{ vars.RCA_BENCH_LLM_BASE_URL }}
          RCA_BENCH_LLM_MODEL: ${{ vars.RCA_BENCH_LLM_MODEL }}
        run: |
          set -eu
          # The exit status is captured, not propagated. A run where the model
          # answered badly is a *result*, and the scorer is what turns it into a
          # verdict. Killing the job here would discard the artefact that says
          # where it went wrong -- which is the mistake the fourth anchor made.
          status=0
          node scripts/derive-fault-golden.mjs --out /tmp/extraction-predictions.json || status=$?
          echo "derive_exit=${status}" >> "$GITHUB_OUTPUT"
          echo "derive exit status: ${status}"

      - name: Score the run
        id: score
        run: |
          set -eu
          status=0
          node scripts/score-fault-extraction.mjs \
            --predictions /tmp/extraction-predictions.json > /tmp/extraction-report.txt 2>&1 || status=$?
          cat /tmp/extraction-report.txt
          echo "score_exit=${status}" >> "$GITHUB_OUTPUT"
          {
            echo "### Fault extraction accuracy"
            echo
            echo '```'
            cat /tmp/extraction-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # The step summary and the job log are the two places the number
          # naturally lands, and neither is readable through the REST API: the
          # job log endpoint 302s to a blob host the sandbox cannot resolve, and
          # a run carries no summary field at all. What *is* served by the API is
          # the check run, whose `output.text` and annotations come back on
          # `GET /check-runs/{id}` -- so the headline is repeated as an
          # annotation, which is the one durable, machine-readable channel this
          # run has.
          #
          # `notice` rather than `warning`: a measurement that misses the
          # threshold is a result, not a problem with the commit, and an
          # annotation level is read by humans who did not just open a workflow
          # file expecting to be told their model is bad.
          #
          # The pattern is anchored to the report's actual layout (see
          # `formatExtractionReport`): every line is indented by two spaces. The
          # The count and layer lines both begin with `graded`, so only one of them
          # is keyed -- the rate, which is the one a reader needs. Keying both
          # produced `graded=19 graded=19/19`, the sort of ambiguous field a reader
          # has to decode rather than read. A loose pattern would also match a
          # per-field rate and report it as the headline with full confidence, so
          # every alternative is an exact two-space-anchored prefix.
          headline=$(sed -n -e 's/^  samples *: /samples=/p' \
                          -e 's/^  graded *: \([0-9][0-9]*\)$/graded_count=\1/p' \
                          -e 's/^  graded: \(.*\)$/graded_rate=\1/p' \
                          -e 's/^  strict all-fields: /strict=/p' \
                          -e 's/^  M1 exit condition: /m1=/p' /tmp/extraction-report.txt | tr '\n' ' ')
          # The per-field lines carry the *diagnosis*, and without them a headline
          # reading `strict=0/19` is unactionable: it says every sample missed at
          # least one field but not which one. The report already prints the
          # breakdown; it is echoed here so the number and its explanation arrive
          # through the same channel. Per-field lines are the four-space-indented
          # `field : graded N/N (P%)  overall ...` rows, so this pattern also has
          # to avoid the two-space headline rows it now runs alongside.
          fields=$(sed -n 's/^    \([a-z][a-z]*\) *: graded \([0-9][0-9]*\)\/\([0-9][0-9]*\).*/\1=\2\/\3/p' /tmp/extraction-report.txt | tr '\n' ' ')
          # The miss classifier counts. The rates above say *that* a field missed;
          # these say whether the miss was a wrong answer or an omission, which is
          # the difference between a capability problem and the model declining to
          # answer. Published separately from the per-sample detail below so this
          # line stays short enough to read at a glance.
          misses=$(sed -n 's/^  Miss classification.*: /classification=/p' /tmp/extraction-report.txt | tr '\n' ' ')
          # The per-sample detail: every miss as `sample field reason expected ->
          # actual`. This is the line that ends the guessing. Four rounds of prompt
          # and comparator reasoning produced hypotheses that one reading of the
          # answers would have settled, and the answers were already being recorded
          # -- only the reading was missing.
          # The `|` delimiter is used instead of `/` because the replacement
          # contains a `/`. Alternating the delimiter is the standard way to keep
          # a substitution readable, and it keeps the test's parser simple: that
          # parser splits on an unescaped `/`, so a literal one in the replacement
          # would both split the expression wrongly and make the split count
          # depend on the data.
          if [ -n "$headline" ]; then
            echo "::notice title=M1 fault extraction::${headline}"
          else
            echo "::notice title=M1 fault extraction::report did not match the expected layout; read the step summary"
          fi
          if [ -n "$fields" ]; then
            echo "::notice title=M1 fault extraction per-field::${fields}"
          fi
          if [ -n "$misses" ]; then
            echo "::notice title=M1 fault extraction misses::${misses}"
          fi
          missed_rows=$(sed -n 's|^    \([a-z][a-z0-9-]*\)  *\([a-z]*\) *\([a-z][a-zA-Z]*\) *\(.*\) -> \(.*\)$|\1.\2:\4>\5|p' /tmp/extraction-report.txt)
          miss_row_count=$(printf '%s' "$missed_rows" | grep -c . || true)
          # Bounded by whole rows, not by characters. `cut -c1-N` was the first
          # attempt and it is wrong: at 19 samples x 3 fields the payload is 4044
          # characters, and a hard cut lands mid-token -- an observed worst case
          # ended `...type:network-loss>wrong network-`, slicing an expected value
          # in half so the reader cannot tell a truncated value from a wrong one.
          # Taking whole rows up to the budget, then stating how many were left
          # out, keeps every published row readable and makes the omission
          # explicit rather than invisible.
          #
          # The cap is 60, measured rather than guessed. The dataset has 19 samples
          # and 3 scored fields, so 57 rows is the arithmetic maximum; the fully
          # saturated payload is 4091 characters and an annotation limit is 64KiB.
          # 60 therefore covers every run this dataset can produce with room to
          # spare, and the truncation path exists for the day the dataset grows --
          # it is a stated bound, not the normal case.
          detail=$(printf '%s' "$missed_rows" | head -n 60 | tr '\n' ' ')
          dropped=$((miss_row_count > 60 ? miss_row_count - 60 : 0))
          if [ -n "$detail" ]; then
            if [ "$dropped" -gt 0 ]; then
              echo "::notice title=M1 fault extraction miss detail::${detail}... [${dropped} more row(s) omitted; all ${miss_row_count} are in the step summary]"
            else
              echo "::notice title=M1 fault extraction miss detail::${detail}"
            fi
          fi
          # The three codes are the point of the script, so they are handled
          # rather than collapsed. `2` is "the model is not good enough yet"
          # and is a normal outcome of a measurement; `3` is "the pipeline
          # produced no usable answer" and is a defect in the wiring. Failing
          # the job for the first would make an honest 65% look like an outage.
          if [ "$status" -eq 3 ]; then
            echo "::error title=No measurement::The run produced no graded sample, so there is no accuracy to report. Read the parse and validation counts in the summary."
            exit 1
          fi
          if [ "$status" -eq 1 ]; then
            echo "::error title=Scoring failed::The predictions or the dataset could not be read."
            exit 1
          fi
          echo "scorer exit status: ${status} (0 = M1 met, 2 = not met)"

      - name: Upload the predictions and the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fault-extraction-accuracy
          path: |
            /tmp/extraction-predictions.json
            /tmp/extraction-report.txt
          if-no-files-found: warn
          retention-days: 30

      # The verdict is the last word of the job, and it is a deliberate non-gate.
      #
      # This job does not fail when the threshold is missed. The number is the
      # product of the run; a red status on a measurement is what taught this
      # repository to stop reading the fourth anchor's logs. The step *states*
      # the outcome and the summary carries it, and a human decides whether 65%
      # is a blocker.
      - name: State the verdict
        if: always()
        run: |
          set -eu
          case "${{ steps.score.outputs.score_exit }}" in
            0) echo "M1 exit condition: MET" ;;
            2) echo "M1 exit condition: NOT MET (measurement exists; this is a result, not an outage)" ;;
            3) echo "M1 exit condition: NOT MEASURED (no graded sample)" ;;
            *) echo "M1 exit condition: UNKNOWN (scoring did not complete)" ;;
          esac
