name: Official data

# The fourth anchor: score our export against real upstream data.
#
# The other three anchors -- the Golden Master, the mutation suite, and the
# official-metric regression on the shipped example -- all run in CI on every
# push and prove our export is *scorable*. They cannot prove it is scorable
# against data we did not write, because the example is ours end to end.
#
# This workflow closes that. It fetches the RCAEval corpora, derives the case
# descriptors from what was actually downloaded, replays the telemetry through
# our IR, and scores the result with RCAEval's own published rule.
#
# ## Why it is separate from CI
#
# It downloads ~19 GB from Zenodo and takes long enough that putting it on every
# push would make the ordinary gate unusable. It runs on a schedule and on
# demand.
#
# ## Why it is on a runner at all
#
# Because the runner has general internet access. The corpora are on Zenodo,
# which is a plain HTTPS host; nothing about this needs a licensed download or an
# interactive step.
#
# ## What this workflow does not fetch, and what that costs
#
# Three anchors, `rcaeval-re1|re2|re3`. Nothing else. The other six score targets
# are `notFetchable` in `golden-master/official-assets.json`, and that file is the
# authority on each one's reason and its alternative -- this comment does not
# restate them, because a second copy of a fact is a second thing to drift.
#
# The OpenRCA entries are worth one line here, because this header used to get
# them wrong. It said the OpenRCA corpora "are handled by the
# `official-openrca.yml` workflow through the cached shard repositories". Both
# halves were false:
#
#   - `official-openrca.yml` does not exist and never has. `git log --all` for
#     that path returns nothing: it was not created and deleted, it was never
#     written.
#   - The shard caches are empty (`total_count: 0` on all six, last successful
#     `cache-dataset.yml` run 2026-08-02, Actions caches expire after 30 days),
#     and they would be unreadable even if populated, because an Actions cache is
#     scoped to the repository that wrote it. Finding 34 measured both halves.
#
# The sentence entered on 2026-09-19 and finding 34 corrected the registry on
# 2026-09-20. The registry was repaired; this comment was not, and it has been
# read as "OpenRCA is handled" ever since. A handler named but never written is
# how a gap comes to look closed, which is the defect the last three rounds of
# this project have each found one layer further out.
#
# `packages/core/test/workflow-claims.test.ts` now fails when a workflow here
# cites a workflow that is not on disk, so this cannot recur silently.
#
# ## What is fetched, and what is kept
#
# The data goes to the runner's temp directory, outside the working tree, and is
# discarded with the runner. `scripts/fetch-official.mjs` refuses a destination
# inside the repository, and `scripts/check-no-vendored-data.mjs` fails the build
# if any of it ever reaches git. Nothing here is committed except the reported
# outcome.
#
# ## Why `runner.temp` and not `/tmp`
#
# It was `/tmp`, and that is what broke the anchor on 2026-10-26 (finding 261).
# The run downloaded and verified `RE2-OB` -- 1 191 025 569 bytes, digest matching
# the registry -- and then died inside `unzip` with `write error (disk full?)`.
#
# The corpus was fine. The filesystem was not. `/tmp` is a 7.9 GiB tmpfs on the
# ubuntu-26.04 image, and `ubuntu-latest` moved from 24.04 to 26.04 on 2026-10-19;
# on 24.04 the same path was part of the runner's ~74 GiB root disk, which is why
# the 2026-10-12 dispatch of this workflow succeeded and the next scheduled run did
# not. Nothing in this repository measured the assumption, and the workflow's own
# `df -h /tmp` step printed the number without anything comparing it to anything.
#
# `runner.temp` is `$RUNNER_TEMP`, on the root filesystem. The destination is named
# once, in the first step, and every later step reads it from the environment --
# one variable because a second copy of a path is a second thing that can drift,
# and the failure mode here was a destination chosen in one place and measured in
# another.
#
# It cannot be `jobs.<id>.env`, which is where it went first: the `runner` context
# does not exist at job level, and GitHub refused the whole file with
# `Unrecognized named-value: 'runner'`, so the workflow did not parse and the push
# run failed in zero seconds. `$GITHUB_ENV` is the mechanism that exists for this,
# and `packages/core/test/official-data-destination.test.ts` now refuses a `runner`
# expression anywhere above `steps:`.

on:
  workflow_dispatch:
    inputs:
      anchor:
        description: Which anchor to fetch and round-trip
        required: true
        default: rcaeval-re2
        type: choice
        options:
          - rcaeval-re1
          - rcaeval-re2
          - rcaeval-re3
  schedule:
    # Mondays at 04:17 UTC. Off the hour so it does not queue behind the
    # top-of-hour jobs every other repository also schedules.
    - cron: '17 4 * * 1'

permissions:
  contents: read

# One fetch at a time, keyed on the anchor rather than on the branch.
#
# This job pulls several gigabytes from Zenodo over as much as fifteen minutes,
# and two of them running at once is not merely wasteful: a host that rate-limits
# concurrent large transfers would produce a fetch failure that looks like an
# upstream outage and is actually self-inflicted. That is the specific mistake
# this guard prevents -- earlier in this repository's history four concurrent
# runs were fired by a retry loop, and the failure they were then used to
# diagnose was quite possibly their own doing.
#
# `cancel-in-progress: false` and not `true`: the job's whole product is a
# measurement, and cancelling a run three minutes into a twelve-minute download
# discards it to start an identical one. A queued second dispatch is the correct
# outcome -- it will run, and it will run after the first has finished rather
# than instead of it. That is also what makes the two `cancelled` runs of
# 2026-09-20 unrepeatable: they were cancelled by each other, and neither
# produced anything.
#
# Keyed on the anchor so a run of `rcaeval-re1` does not block `rcaeval-re3`;
# they fetch different assets and do not contend.
concurrency:
  group: official-data-${{ github.event.inputs.anchor || 'rcaeval-re2' }}
  cancel-in-progress: false

jobs:
  round-trip:
    name: Fetch, ingest, export and score the official corpus
    runs-on: ubuntu-latest
    # The fetch is the slow part and it is a network operation against a host we
    # do not control. Bounded so a stalled download fails rather than occupying a
    # runner for hours.
    timeout-minutes: 90
    steps:
      # The destination is named once, here, and every later step reads it from
      # the environment. `runner.temp` is on the runner's root filesystem; `/tmp`
      # is a tmpfs there, and finding 261 is what that cost.
      #
      # It is a step rather than `jobs.<id>.env` because the `runner` context does
      # not exist there. The first version of this change put four
      # `${{ runner.temp }}` expressions at job level and GitHub refused the file
      # outright -- `Unrecognized named-value: 'runner'` -- which no test in this
      # repository could have seen, because the rule was about text and the defect
      # was about which contexts exist where. A workflow that does not parse is a
      # workflow that does not run at all, and the push-triggered run failed in
      # zero seconds saying so.
      - name: Name the destination once
        run: |
          set -eu
          {
            echo "OFFICIAL_DIR=$RUNNER_TEMP/official"
            echo "REPORTS=$RUNNER_TEMP/reports"
            echo "PINS=$RUNNER_TEMP/reports/pins.json"
            echo "CASES=$RUNNER_TEMP/reports/rcaeval-cases.json"
            echo "SCORES=$RUNNER_TEMP/reports/rcaeval-scores.json"
          } >> "$GITHUB_ENV"
          mkdir -p "$OFFICIAL_DIR" "$REPORTS"

      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (the round trip reads core's dist)
        run: pnpm build

      # The destination is created here, so this line measures the filesystem the
      # fetch will write to. The version of this step that ran `df -h /tmp`
      # measured a directory the fetch had stopped using -- a number about
      # somewhere else, printed with nothing to compare it against, which is how a
      # 7.9 GiB tmpfs stayed invisible for a week (finding 261). The check that
      # refuses is in the fetch script, where it can name the requirement too;
      # this line is the evidence a human reads afterwards, and it is about the
      # same path the fetch uses because it reads the same variable.
      - name: Report free disk at the destination
        run: df -h "$OFFICIAL_DIR"

      # The measurement is written to a file rather than left in the log.
      #
      # A digest that only exists in a log has to be read out by a human and
      # retyped into the registry, and a mistyped hex digit there does not fail
      # loudly -- it makes every later run report a mismatch against a good
      # download. This makes the measurement data.
      #
      # The exit status is captured rather than propagated, so the failure is
      # summarised into the step summary and the log *stays readable*: the
      # reason a 12-minute fetch failed was the one thing the first real run
      # did not record, and it took a re-run to find out.
      #
      # The statuses are named separately because they call for different
      # actions, and collapsing them is what made twelve consecutive failures
      # require log excavation to understand:
      #
      #   124  the workflow's own per-asset bound fired; no measurement
      #   3    the destination cannot hold the corpus. This is a fact about the
      #        filesystem, not about the network: the same re-run on the same
      #        destination fails identically (finding 261)
      #   2    an asset downloaded a file that does not match the registry pin.
      #        This is *not* a network problem -- the bytes arrived -- so
      #        re-running is wasted; the registry or the upstream asset has to
      #        be looked at
      #   4    an asset matched its pin and would not unpack. The bytes are the
      #        bytes the registry describes, so the archive upstream is unusable
      #   1    an asset could not be reached at all; re-running is reasonable
      #
      # The list is the script's own vocabulary, and the script's header states
      # the same five. A case that is missing here would fall into `*` and be
      # described as a network failure -- which is precisely what happened to a
      # full disk, the one failure among these that re-running can never fix.
      - name: Fetch the corpus outside the working tree
        id: fetch
        env:
          ANCHOR: ${{ github.event.inputs.anchor || 'rcaeval-re2' }}
        run: |
          set -eu
          echo "anchor=${ANCHOR}" >> "$GITHUB_OUTPUT"
          # A per-asset timeout, because the script's own bound is per attempt
          # and an anchor has several assets: three assets x three attempts x
          # 900s is 2h15m of curl, which fits inside the job's 90 minutes only
          # because the job kills it -- and a job killed by its own timeout
          # reports no measurement and no reason.
          status=0
          timeout 3000 node scripts/fetch-official.mjs \
            --anchor "$ANCHOR" --out "$OFFICIAL_DIR" --report-pins "$PINS" || status=$?
          {
            echo "### Fetch outcome"
            echo
            case "$status" in
              124)
                echo "**Timed out** after 50 minutes (the workflow's own per-asset bound). No measurements."
                ;;
              0)
                echo "All assets for \`${ANCHOR}\` fetched."
                ;;
              1)
                echo "**Unreachable** (exit status 1). An asset could not be downloaded. The"
                echo "per-asset reason is in the log above, one \`SKIPPED\` line per asset, and"
                echo "re-running is a reasonable next step."
                ;;
              3)
                echo "**Does not fit.** The destination is smaller than the corpus, so nothing was"
                echo "unpacked for the asset that did not fit and the assets after it were not attempted."
                echo "This is **not** a network failure -- re-running on the same filesystem fails"
                echo "identically. The log names the requirement and the free space; \`OFFICIAL_DIR\` is on"
                echo "the runner's root filesystem, and a destination with less room has to be chosen"
                echo "deliberately rather than by pointing at the first path that exists."
                ;;
              2)
                echo "**Pin mismatch.** An asset completed its transfer and the bytes do not match the"
                echo "registry: the file is not the file \`golden-master/official-assets.json\` describes."
                echo "Retrying cannot turn one file into another, so this is reported instead of retried."
                echo "Check the pin against a fresh \`--report-pins\` measurement, and check whether the"
                echo "upstream asset changed under us. This is **not** a network failure."
                ;;
              4)
                echo "**Could not unpack** (exit status 4). An asset matched its pin and \`unzip\` refused"
                echo "it, so the bytes are the bytes the registry describes and the archive is not usable."
                echo "Re-downloading fetches the same file; the upstream asset or the registry entry"
                echo "needs a human."
                ;;
              *)
                # No cause is named here on purpose. Every status the script documents
                # is handled above; what reaches this branch is a status nothing
                # anticipated -- an OOM kill (137), a signal, the timeout wrapper's own
                # convention -- and the previous version of this branch described all of
                # them as "an asset could not be downloaded". That is the same mistake in
                # miniature as the one this whole change is about: a fallback asserting a
                # cause it cannot know.
                echo "**Unrecognised exit status ${status}.** The fetch script documents 0 to 4, and"
                echo "\`scripts/fetch-official.mjs\` is the authority on what each one means. Something"
                echo "outside that vocabulary ended this run -- a signal, a kill, or the timeout wrapper."
                echo "The reason is in the log above, not in this summary."
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Whether the registry's pins agree with what was just downloaded, and
      # whether it has any at all.
      #
      # `--check` writes nothing on purpose. A runner that could edit the
      # registry would let an unreviewed change reach `master`, and the whole
      # point of pinning is that a human looks at the number once. So this job
      # *reports* the drift and the pinning itself is a reviewed commit.
      #
      # `continue-on-error` is deliberately not used here. This step does not
      # fail the job because it *reports* rather than asserts, and the difference
      # is the `if`: a mismatch is a finding about the registry's state on the
      # first run, so it is surfaced as a warning and the round trip continues to
      # the assertion that actually matters. Nothing is being swallowed -- the
      # pin disagreement is printed in full and repeated in the summary.
      - name: Compare the measured pins against the registry
        if: always()
        run: |
          set -u
          node scripts/fetch-official.mjs --list
          echo
          if [ ! -f "$PINS" ]; then
            echo "no pin report was written; the fetch did not complete"
            exit 0
          fi
          if node scripts/apply-pins.mjs --report "$PINS" --check; then
            echo "registry pins agree with this download"
          else
            echo
            echo "::warning title=Unpinned or drifted assets::The registry does not record these measured digests. Merge $PINS into golden-master/official-assets.json in a reviewed commit; the values are in the run summary."
          fi

      # The descriptors are derived from the download, never committed.
      #
      # A committed list would be a transcription of a corpus nobody can verify
      # from the repository -- which is the failure mode this whole path exists
      # to avoid. Deriving them here means the labels and the injection instants
      # come from the same bytes the round trip scores.
      - name: Derive the case descriptors from what was downloaded
        run: |
          set -eu
          node scripts/gen-rcaeval-cases.mjs --official-dir "$OFFICIAL_DIR" --out "$CASES"

      - name: Round-trip the corpus and score it with the official rule
        run: |
          set -eu
          # `--report` writes the score report: one record per declared case and
          # a summary over the scored ones, written before every exit including
          # the failing ones. Without it the only score in existence was the
          # `oracle=` figure on each ROUNDTRIP line, and this step's artifact
          # carried the descriptors and the pins and no scores -- so the answer to
          # P0-2's "a score report on the real corpus" was a line in a log, which
          # is what finding 155 is about.
          node scripts/check-official.mjs --official-dir "$OFFICIAL_DIR" --cases "$CASES" --report "$SCORES"

      - name: Report free disk at the destination after the fetch
        if: always()
        run: df -h "$OFFICIAL_DIR"

      # Two artefacts, and they are different kinds of thing:
      #
      #  - the descriptor file is what a future run is compared against when a
      #    corpus changes under us;
      #  - the pins file is the measurement that gets merged into the registry.
      #
      # Neither is corpus data. The 19 GB archive dies with the runner.
      - name: Upload the derived descriptors, the score report and the measured pins
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcaeval-${{ steps.fetch.outputs.anchor || 'rcaeval-re2' }}-round-trip
          # `with:` is evaluated before the step runs, so it cannot read the
          # variables the naming step exported at run time. The directory is
          # named again here as an expression -- and a test holds this path's
          # basename to the `REPORTS` the naming step declares, so the two
          # spellings cannot drift apart silently.
          path: ${{ runner.temp }}/reports
          if-no-files-found: warn
          retention-days: 30

      # The measured digests go in the run summary, so closing the loop does not
      # require downloading an artefact and reading JSON by eye.
      - name: Summarise the measured pins
        if: always()
        run: |
          set -eu
          if [ ! -f "$PINS" ]; then
            echo "### No pin report" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "The fetch produced no measurements, so there is nothing to pin. The job log above says why." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Measured pins"
            echo
            echo "Merge these into \`golden-master/official-assets.json\` in a reviewed commit;"
            echo "\`scripts/apply-pins.mjs --report $PINS\` writes exactly these two fields."
            echo
            echo "| asset | bytes | sha256 |"
            echo "| --- | --- | --- |"
            # The path arrives as an argument rather than interpolated into the
            # program, because a shell-expanded path inside a single-quoted
            # program is a literal and one inside a double-quoted program is a
            # expansion that strips the quoting -- the defect
            # `check-no-unsafe-shell.mjs` exists for.
            node -e '
              const r = require(process.argv[1]);
              for (const a of r.assets) {
                console.log(`| ${a.id} | ${a.bytes} | \`${a.sha256}\` |`);
              }
              if (r.assets.length === 0) console.log("| _(none measured)_ | | |");
            ' "$PINS"
          } >> "$GITHUB_STEP_SUMMARY"
