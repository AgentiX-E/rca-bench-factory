name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    name: typecheck / lint / test / coverage / mutation / golden-master / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (core then cli; cli resolves core's dist)
        run: pnpm build

      - name: Type-check
        run: pnpm typecheck

      # Six static checks, all of them earned by a failure rather than chosen in
      # advance. The fifth exists because `scripts/inject-stability.mjs` shipped
      # with the author's absolute checkout path hard-coded, passed locally on every
      # run, and failed this very workflow on its first execution -- a gate that
      # could only pass on one machine. See finding 77.
      #
      # The sixth, `verify-scorer-stability.mjs`, guards the instrument itself: that
      # a rate is a measurement rather than a sample. It was written, documented as
      # "worth a test rather than an assumption", given a package script -- and never
      # added to any step, so no job had ever executed it. It belongs in this chain
      # rather than a step of its own because the other five answer the same kind of
      # question: is the tree in a state we are willing to measure. See finding 83.
      - name: Lint (no mock / no secrets / no vendored data / registry / absolute paths / scorer stability)
        run: pnpm lint

      - name: Test with coverage (core + cli, ≥95% per dimension, 100% functions)
        run: pnpm test:coverage

      - name: Mutation suite (gate + export, 100% interception)
        run: pnpm exec vitest run --root packages/core mutation.test.ts

      # The scorer-stability battery is a gate, not a report.
      #
      # It mutates the shipped scorer and requires every mutation to be caught, so
      # it answers a question the coverage number cannot: whether the stability
      # properties are *enforced*. Exit is non-zero for a survivor AND for an inert
      # mutation -- an injection whose anchor no longer matches produces the same
      # output as a toothless test, and reporting that as a pass would be a false
      # reading of the kind findings 68 and 74 both describe.
      - name: Scorer stability battery (no survivors, no inert mutations)
        run: node scripts/inject-stability.mjs

      # The `component` rule battery, for the same reason as the one above and
      # with a sharper history. Finding 75's assertions were written three times:
      # the first asserted a literal against an identical literal, the second a
      # count with a `>=` bound, and only the third -- a contrast between the
      # rule's behaviour on right and wrong answers -- could be mutated at all.
      # Each rewrite was driven by this battery reporting SURVIVED, so it is the
      # reason the assertions are load-bearing rather than decorative.
      - name: Component rule battery (no survivors, no inert mutations)
        run: node scripts/inject-component-rule.mjs

      # The M1-ceiling probe reports the number the milestone's exit condition is
      # read against, so it is held to the same standard as any other figure this
      # repository publishes: it must move when what it measures moves. The probe
      # partitions the ground truth into recoverable and unrecoverable components
      # and reports the strict ceiling under two definitions; the battery drives
      # both halves of that, and its partition guard is what makes an injection
      # which lets the two halves disagree fail rather than print a tidy number.
      - name: M1-ceiling probe battery (no survivors, no inert mutations)
        run: python3 scripts/injection/m1-ceiling-probe.py

      # The second half of the same standard, applied to the assertions about the
      # probe rather than to the probe. Its first run had three survivors and two
      # misclassified mutations: `failed > 0` counts a suite that never ran as a
      # survivor, because zero failures is also what a passing suite reports. A
      # mutation the runner cannot survive and a mutation nothing detects must not
      # print the same word, so the battery now reads the total test count.
      - name: M1-ceiling probe test battery (no survivors, no inert mutations)
        run: node scripts/inject-m1-ceiling-tests.mjs

      # The `type`-miss classifier reports the partition that decides whether the
      # `type` shortfall is a scoring defect or a capability limit, so it is the
      # figure the milestone's next round is planned against. Its battery is the
      # first here whose injections are *paired*: four of them are only decidable
      # as a definition edit plus the data edit that makes the definition
      # observable, and the pair is expressed as an `also` slot rather than as a
      # comment describing one. A battery that asserts half a pair and describes
      # the other half reports SURVIVED, correctly, and says nothing.
      - name: Type-miss probe battery (no survivors, no inert mutations)
        run: python3 scripts/injection/type-miss-probe.py

      # The five gate scripts above are covered by CI *running* them against the
      # real tree, which proves they do not crash and proves nothing about
      # whether they would refuse. That is a weaker claim than a test that forces
      # them to fail, and this battery is what converts the one into the other:
      # each injection removes a specific guard from a gate and requires the
      # gate's own test file to go red. It found two things the tests could not
      # have -- a dead branch in `check-readme-sample.mjs` whose comment promised
      # a guarantee no input can reach, and a walk guard in
      # `gen-rcaeval-cases.mjs` that is redundant with the try/catch below it.
      # Both are reported rather than papered over; the redundant one is listed
      # in the battery's `EXPECTED_SURVIVORS` with its reason, and the run fails
      # if it ever turns into a genuine survivor.
      - name: Gate-test battery (each gate's test provably fails when its guard is removed)
        run: python3 scripts/injection/gate-tests-battery.py

      # The scorer-stability gate is only worth its green if it would refuse a
      # scorer that lost a stability property. Four of its properties were
      # previously unfalsifiable -- the fixture could not exhibit the failure they
      # looked for -- so this battery mutates the built scorer and requires the gate
      # to name the property that broke. See finding 83.
      - name: Scorer-stability probe battery (the stability gate refuses a broken scorer)
        run: python3 scripts/injection/scorer-stability-probe.py

      - name: Golden Master verification
        run: node golden-master/verify.mjs

      - name: Official-metric regression on the shipped example
        run: pnpm official:check

      - name: Examples and site data are up to date
        run: pnpm examples:check

      - name: README usage sample runs against the built package
        run: node scripts/check-readme-sample.mjs

      - name: CLI reference matches the built binary
        run: node scripts/check-cli-reference.mjs

      - name: Example pack is up to date
        run: pnpm examples:bundle:check

      - name: Example pack is readable by tar and matches the repository
        run: |
          set -eu
          tar -tzf site/assets/rca-bench-factory-examples.tar.gz
          rm -rf /tmp/example-pack
          mkdir -p /tmp/example-pack
          tar -xzf site/assets/rca-bench-factory-examples.tar.gz -C /tmp/example-pack
          diff -r /tmp/example-pack/rca-bench-factory-examples/examples/order-prod examples/order-prod
          sh -n /tmp/example-pack/rca-bench-factory-examples/run.sh

      - name: Example pack verifies against its own manifest
        run: node scripts/verify-example-pack.mjs
