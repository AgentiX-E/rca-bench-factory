name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    name: typecheck / lint / test / coverage / mutation / golden-master / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (core then cli; cli resolves core's dist)
        run: pnpm build

      - name: Type-check
        run: pnpm typecheck

      # Five static checks, all of them earned by a failure rather than chosen in
      # advance. The last one exists because `scripts/inject-stability.mjs` shipped
      # with the author's absolute checkout path hard-coded, passed locally on every
      # run, and failed this very workflow on its first execution -- a gate that
      # could only pass on one machine. See finding 77.
      - name: Lint (no mock / no secrets / no vendored data / registry / absolute paths)
        run: pnpm lint

      - name: Test with coverage (core + cli, ≥95% per dimension, 100% functions)
        run: pnpm test:coverage

      - name: Mutation suite (gate + export, 100% interception)
        run: pnpm exec vitest run --root packages/core mutation.test.ts

      # The scorer-stability battery is a gate, not a report.
      #
      # It mutates the shipped scorer and requires every mutation to be caught, so
      # it answers a question the coverage number cannot: whether the stability
      # properties are *enforced*. Exit is non-zero for a survivor AND for an inert
      # mutation -- an injection whose anchor no longer matches produces the same
      # output as a toothless test, and reporting that as a pass would be a false
      # reading of the kind findings 68 and 74 both describe.
      - name: Scorer stability battery (no survivors, no inert mutations)
        run: node scripts/inject-stability.mjs

      # The `component` rule battery, for the same reason as the one above and
      # with a sharper history. Finding 75's assertions were written three times:
      # the first asserted a literal against an identical literal, the second a
      # count with a `>=` bound, and only the third -- a contrast between the
      # rule's behaviour on right and wrong answers -- could be mutated at all.
      # Each rewrite was driven by this battery reporting SURVIVED, so it is the
      # reason the assertions are load-bearing rather than decorative.
      - name: Component rule battery (no survivors, no inert mutations)
        run: node scripts/inject-component-rule.mjs

      - name: Golden Master verification
        run: node golden-master/verify.mjs

      - name: Official-metric regression on the shipped example
        run: pnpm official:check

      - name: Examples and site data are up to date
        run: pnpm examples:check

      - name: README usage sample runs against the built package
        run: node scripts/check-readme-sample.mjs

      - name: CLI reference matches the built binary
        run: node scripts/check-cli-reference.mjs

      - name: Example pack is up to date
        run: pnpm examples:bundle:check

      - name: Example pack is readable by tar and matches the repository
        run: |
          set -eu
          tar -tzf site/assets/rca-bench-factory-examples.tar.gz
          rm -rf /tmp/example-pack
          mkdir -p /tmp/example-pack
          tar -xzf site/assets/rca-bench-factory-examples.tar.gz -C /tmp/example-pack
          diff -r /tmp/example-pack/rca-bench-factory-examples/examples/order-prod examples/order-prod
          sh -n /tmp/example-pack/rca-bench-factory-examples/run.sh

      - name: Example pack verifies against its own manifest
        run: node scripts/verify-example-pack.mjs
