name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    name: typecheck / lint / test / coverage / mutation / golden-master / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (core then cli; cli resolves core's dist)
        run: pnpm build

      - name: Type-check
        run: pnpm typecheck

      - name: Lint (no mock / no secrets)
        run: pnpm lint

      - name: Test with coverage (core + cli, ≥95% per dimension, 100% functions)
        run: pnpm test:coverage

      - name: Mutation suite (15/15 interception)
        run: pnpm exec vitest run --root packages/core mutation.test.ts

      - name: Golden Master verification
        run: node golden-master/verify.mjs
