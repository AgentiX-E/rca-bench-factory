name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# `contents: write` is granted for one step and one step only -- publishing the
# battery's report to the orphan `ci-reports` branch. It was `read` when that
# step was added, so the token could not create a ref, the publish answered 403,
# and the step's own tolerance printed the failure and returned 0. The observed
# result was a green step that published nothing, which is this project's
# recurring mistake one level up: a channel reporting success while carrying no
# content. The grant is workflow-wide because that is the smallest unit GitHub
# offers, but no other step in this job uses it, and the branch it writes to is
# not `master`.
permissions:
  contents: write

jobs:

  # The verification steps, split out from the batteries below by finding 166.
  #
  # What the split is for: the single job that carried all of this had a
  # `timeout-minutes: 20`, and on 637d11494 the batteries pushed it past that. The
  # run was reported as `cancelled` with the last eight steps `skipped`, which reads
  # like somebody stopped it rather than like a budget being spent -- so the fix is
  # not a bigger number in one bucket, it is three buckets whose wall clocks run
  # beside each other.
  #
  # Measured, from the API rather than from a feeling: on 5dcabae61 (run
  # 38583708998) the job's steps summed to 845 s, of which these four are ~60 s; on
  # 637d11494 they summed to 1213 s before the budget killed the job at the round-trip
  # record battery.
  verify:
    name: build / typecheck / lint / coverage / mutation
    runs-on: ubuntu-latest
    # Not a performance assertion: a job that hangs has to be reported as a budget
    # being spent rather than six hours later.
    #
    # 15 until v3.55, and 18 now, because the deadline was being argued from a fast day.
    # `Lint`'s 14-minute bound plus the steps in front of it is 1019 s once each of those
    # steps is counted at its slowest recorded day rather than at the day of the
    # recording -- 164 s of that prefix is the shell install at 153 s instead of 9 --
    # and 1019 does not fit in 900. `Test with coverage` was the second one out, at 902.
    # 18 is a minute more than the longest deadline, so the step bound still fires before
    # the job does rather than with it.
    timeout-minutes: 18
    steps:
      - name: Check out
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Set up Node.js
        timeout-minutes: 3
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        timeout-minutes: 3
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        timeout-minutes: 3
        run: pnpm install --frozen-lockfile

      - name: Install the shells the suite cross-checks against
        timeout-minutes: 6
        # `check-no-unsafe-shell.test.ts` compares the gate's rule against what
        # `zsh` and `bash` actually do with the same string, which is the
        # strongest acceptance criterion in the tree: the thing being modelled is
        # installed, so the verdict is a measurement rather than a reading of a
        # spec.
        #
        # `bash` is on the runner; `zsh` is not, and the workflow never installed
        # it. The fixture therefore passed here and failed on `ubuntu-24.04`
        # (finding 130): a missing binary produced `status: null` from spawnSync,
        # and `null !== 0` read that as "zsh rejected it". The fixture now reports
        # the missing binary honestly, which is why this step exists rather than
        # an exemption for the runner.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      - name: Build (core then cli; cli resolves core's dist)
        timeout-minutes: 3
        run: pnpm build

      - name: Type-check
        timeout-minutes: 3
        run: pnpm typecheck

      # Six static checks, all of them earned by a failure rather than chosen in
      # advance. The fifth exists because `scripts/inject-stability.mjs` shipped
      # with the author's absolute checkout path hard-coded, passed locally on every
      # run, and failed this very workflow on its first execution -- a gate that
      # could only pass on one machine. See finding 77.
      #
      # The sixth, `verify-scorer-stability.mjs`, guards the instrument itself: that
      # a rate is a measurement rather than a sample. It was written, documented as
      # "worth a test rather than an assumption", given a package script -- and never
      # added to any step, so no job had ever executed it. It belongs in this chain
      # rather than a step of its own because the other five answer the same kind of
      # question: is the tree in a state we are willing to measure. See finding 83.
      - name: Lint (no mock / no secrets / no vendored data / registry / absolute paths / scorer stability / site proofs)
        # 12 -> 14 on the round the recording moved to run 42172498744. The 12 was sized
        # from 347 s in v3.53, and twice 347 is 694 -- inside 720 by 26 seconds. This run
        # measured **361 s**, and twice that is 722, which is 2 seconds past the bound:
        # `R4` refused a step that had done nothing but run on a slightly slower machine.
        # 14 minutes is 840 s, 2.33x the measurement, and it still fits the job: 840 plus
        # the 27 s measured in front of it is 867, inside the 15-minute ceiling, so no
        # ceiling had to move and `R6` had nothing to excuse. The general shape -- a bound
        # at exactly twice a reading is a bound that fires on a 5% slower day -- is
        # finding 422, and the margin here is deliberate rather than arithmetic.
        timeout-minutes: 14
        run: pnpm lint

      - name: Test with coverage (core + cli, ≥95% per dimension, 100% functions)
        timeout-minutes: 6
        run: pnpm test:coverage

      # The published counts, against the run that just happened.
      #
      # `docs/progress.md` publishes how many files and tests the suite has, and
      # `golden-master/doc-counts.json` is the measurement those rows are checked
      # against -- but until pass 57 nothing in the pipeline compared the snapshot
      # to the suite. `docs:check` compares the *document* to the snapshot, so the
      # pair could be wrong together and every gate would report agreement.
      #
      # Pass 54 tried the obvious wiring, a second `docs:counts:check` step in this
      # job, and the runner refused it: `[vitest-worker]: Timeout calling
      # "onTaskUpdate"` with every test green, because that check spawns three more
      # suites and the coverage step above had already run them. The measurement
      # was never the problem; the job was missing a way to *reuse* it.
      #
      # `test:coverage` now writes vitest's JSON report beside its coverage output,
      # and `--from` derives the same three scopes from those reports in ~0.1 s.
      # Measured: 80.09 s for the spawn path against 0.12 s for this one, on the
      # same trees and the same numbers.
      - name: Published suite counts, read from that run rather than taken again
        timeout-minutes: 3
        run: node scripts/measure-doc-counts.mjs --check --from packages/core/node_modules/.cache/vitest-report.json,packages/cli/node_modules/.cache/vitest-report.json

      - name: Mutation suite (gate + export, 100% interception)
        timeout-minutes: 3
        run: pnpm exec vitest run --root packages/core mutation.test.ts

      # One reader, against a server this repository did not write.
      #
      # `docs/progress.md` carried this from pass 48: six readers are certified by a fixture the
      # same author wrote, so what that certifies is one reading of six APIs. Two of the six were
      # pointed at real deployments once, by hand, and what that cost was somebody standing a
      # service up. The distribution already carries Prometheus 2.45.3 -- the same version pass 44
      # measured by hand -- so the cost here is an `apt-get` and nine seconds.
      #
      # The scorer-stability battery is a gate, not a report.
      #
      # It mutates the shipped scorer and requires every mutation to be caught, so
      # it answers a question the coverage number cannot: whether the stability
      # properties are *enforced*. Exit is non-zero for a survivor AND for an inert
      # mutation -- an injection whose anchor no longer matches produces the same
      # output as a toothless test, and reporting that as a pass would be a false
      # reading of the kind findings 68 and 74 both describe.


  # The backend install and the reader against it, split out of `verify` by finding 206.
  #
  # The same shape as the split in finding 166, one level down and four rounds later: a
  # budget shared by steps whose costs differ by two orders of magnitude is a budget that
  # will be blamed on the wrong one. Measured on f1eee910 (run 39764133768) from the API:
  # the verify job's first twelve steps summed to **259 s**, and `apt-get install
  # prometheus` took **648 s** and was then cancelled at the job's 900 s -- reported as
  # `cancelled`, which reads like somebody stopped the run rather than like a budget
  # being spent.
  #
  # The comment beside the install said "an `apt-get` and nine seconds". Nine seconds is
  # what it costs where the apt index and the package cache are warm; a cold
  # `ubuntu-latest` runner pays for both, and the number had never been taken there. A
  # budget sized on a number that was never measured is the defect, and a bigger number
  # in the same bucket would hide it: the reader would go on being cancelled whenever the
  # distribution's package grew.
  backend:
    name: a backend this repository did not write, and a reader against it
    runs-on: ubuntu-latest
    # Measured 648 s for the install alone on a cold runner, plus a build and a reader.
    # The headroom is for the variable half -- an apt mirror having a bad day is not a
    # finding about this repository -- and it is bounded so that a hang is still reported
    # as a budget being spent.
    #
    # 20 -> 34 on the round that finally had to bound the steps. `R4` refuses a job
    # measured over three minutes whose steps declare no `timeout-minutes` at all, and
    # this job had never crossed that line: 37 s in run 42160224254, 296 s in 42165763231,
    # because `apt-get install prometheus` is a mirror having a good or a bad day. Once
    # the line is crossed the floor applies to every step, and seven steps at three
    # minutes are 21 -- one more than the ceiling it had, so the job could not be
    # bounded at all. The ceiling is the floor's sum (15) plus the install's bound (16)
    # plus the reader's (3): the install is sized by the 648 s measured on a cold runner
    # rather than by the 37 s of a warm one, because a bound that fits the fast day is a
    # bound that fires on the slow day.
    timeout-minutes: 34
    steps:
      - name: Check out
        uses: actions/checkout@v4
        timeout-minutes: 3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        timeout-minutes: 3
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        timeout-minutes: 3
        with:
          version: 10

      - name: Install dependencies
        timeout-minutes: 3
        run: pnpm install --frozen-lockfile

      - name: Build (core then cli; cli resolves core's dist)
        timeout-minutes: 3
        run: pnpm build

      # The gate starts the server on a port of its own, reads it, reads it again with a label the
      # server does not set, and stops it. A missing binary fails the step with the package name
      # rather than reading as a broken reader. 16 minutes is 1.5 times the 648 s this step
      # measured on a cold runner and 3.5 times the 273 s of run 42165763231: the spread
      # belongs to the mirror, and a bound sized on the fast day would report the slow day as
      # a hang.
      - name: Install a backend this repository did not write
        timeout-minutes: 16
        run: sudo apt-get update -qq && sudo apt-get install -y -qq prometheus

      - name: A reader, against that backend
        timeout-minutes: 3
        run: node scripts/verify-reader-against-backend.mjs

  # The other half of a proof. `verify-site-proofs.mjs` asks whether a witness reaches
  # the exit it claims; this asks whether it would notice that exit's absence. A test
  # that drives a gate, watches it fail and asserts nothing about the failure reaches
  # every exit the gate has and would still pass if the gate stopped failing -- so it
  # proves that the gate ran, not that the exit it claims exists.
  #
  # Why its own job: it is a mutation pass of 150 claimant runs, three minutes at four
  # at a time. The pass edits nothing -- the exit code is replaced inside the child --
  # so it would be safe beside the coverage run, but three more minutes inside a
  # fifteen-minute budget that already spends six is a bound waiting to fire. Parallel,
  # so the workflow's wall clock is still the batteries.
  sensitivity:
    name: every proved exit can disappear without a word
    runs-on: ubuntu-latest
    # Measured twice, because the first number was this machine's and the second is a
    # runner's: 3 min 20 s for 150 runs at four at a time while writing it, and **7.0
    # minutes** end to end on `ubuntu-latest` in run 41416005911 -- install, shells,
    # build and pass together, which is 2.1 times the local figure. The budget is a
    # little over twice the runner's measurement, and it is bounded so that a hang is
    # reported as a budget being spent rather than six hours later.
    #
    # It is 26 rather than 21 as of v3.53's close-out, and the number is derived rather
    # than chosen: the sites battery measured 626 s in run 42131836805, so `R4` asks for
    # 1252 s of bound and 20 minutes (1200 s) is 52 s short. 25 minutes is 1500 s -- 2.4
    # times the measurement, the same margin this job had at 20 minutes against 482 s --
    # and the 22 s of setup in front of the step puts its deadline at 1522 s. A ceiling
    # of 25 would kill the job before the step's own bound could fire, which is the defect
    # step bounds exist to remove (`ci-budget.mjs`, `R5`). The ceiling is `ceil(1522/60)`.
    #
    # Two shards, one bound each (v3.54). That 52 s was the closest this campaign has
    # come to `R4` refusing a legitimate run, and the repair is to spend less rather than
    # to buy another margin: the sorted claimant files are divided across this job and
    # `sensitivity-shard`, so each runner spends roughly half of 626 s against the same
    # 25-minute bound and the workflow's wall clock is the slower shard, not their sum.
    # The bound is deliberately not tightened in the round that splits -- its measurement
    # is of the unsharded command, and `R4` has to size a bound from a run of the command
    # it will enforce. The first sharded run supplies that measurement.
    timeout-minutes: 26
    steps:
      - name: Check out
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Set up Node.js
        timeout-minutes: 3
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        timeout-minutes: 3
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        timeout-minutes: 3
        run: pnpm install --frozen-lockfile

      # The claimants are the same files `verify` runs, so this job needs the same
      # shells: the pass spawns each claimant, not a subset of them. Registered in
      # `SUITE_JOB_IDS` for that reason -- a job that runs the suite without the
      # shells the suite cross-checks against is a job whose verdicts depend on which
      # runner it landed on (finding 130).
      - name: Install the shells the suite cross-checks against
        timeout-minutes: 6
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      - name: Build (core then cli; cli resolves core's dist)
        timeout-minutes: 3
        run: pnpm build

      # Two batteries, two bounds -- and a step that no run has measured yet.
      #
      # `verify-sites-are-sensitive` asks whether a test would notice an exit disappearing;
      # `verify-claims-are-sensitive` asks whether an edit makes an exemption's *claim* false
      # and its named test go red -- the half a title cannot answer. Seven claims, twelve
      # single-file suites, twelve seconds local.
      #
      # They shared this step until v3.52, and not by choice: a step could not be added.
      # The recording pins the step's name, `R2` refused a step it had never measured, and
      # a measurement needs a run that the gate's own redness was blocking (finding 403).
      # The result was a step whose name described half of what it ran, which is the defect
      # a step bound exists to remove, one level down: the verdict names a battery that is
      # not the one that hung, and a reader who trusts the name reads a green line about a
      # command it never ran.
      #
      # The second battery is its own step now, and `golden-master/ci-declarations.json`
      # said so for the one round it took to measure it. `R8` let a step the recording had
      # not measured carry a bound anyway, on every condition that does not need a number:
      # the step exists in that job, the bound is the one written here rather than one the
      # declaration invents and it clears the floor, it still expires before the job does,
      # no measured step follows it, and it argues for itself in a sentence. The lifetime is
      # one recording, and it is structural rather than promised: `measure-ci-baseline.mjs`
      # refuses to write a reading that omits any step of the workflow, so the first refresh
      # measures this one, and `R7` requires a refresh on every round that cites a run.
      #
      # The bound is the floor, and the number behind it is subtraction rather than a guess:
      # the combined step measured 578 s in run 41809961840 and the sites battery alone 542 s
      # in run 41785707854, so this battery is 36 s of it -- 180 s is five times that, and
      # 3 min is what the floor allows a step that could also be 0 s on a run whose cache
      # missed. `R4` is the rule that has nothing to stand on until the measurement exists,
      # which is why the refresh is the moment this bound is checked rather than merely
      # written -- and it was: run 41835348742 measured the step at **20 s**, nine times its
      # bound, and the declaration was deleted in the commit that recorded it.
      # 20 -> 25 in v3.53's close-out: 182 claims and 237 runs measured 626 s on the
      # runner, and twice that is 1252 s. The bound is a function of the measurement, so
      # it moves when the measurement does; the ceiling above it moves by `R5`.
      #
      # v3.54: this step runs shard 1 of 2. Its name is unchanged on purpose -- `R2` pins
      # the recording to it, so a recording taken from the unsharded run still names a
      # step that exists. `checkShardPlan` reads both shard calls and the real inventory
      # and refuses a plan whose union is not every proved claim exactly once.
      # 25 until v3.55, and 22 now. The bound was 25 because one day measured 626 s and
      # twice that is 1252; the history holds a 633 s day since, and twice 633 is 1266,
      # which 25 still covers -- but the deadline no longer does. Three minutes of shell
      # install in front of this step, counted at the 153 s it has really taken, puts the
      # 25-minute bound's expiry at 1680 s, past the 26-minute ceiling: the job would die
      # first and name nothing. 22 minutes is 7 s of room over twice the slowest recorded
      # day and 1500 s of deadline, which fits. Narrowing the bound is what makes the
      # ceiling unnecessary rather than the other way round.
      - name: Every proved exit can disappear without a word
        timeout-minutes: 22
        run: node scripts/verify-sites-are-sensitive.mjs --shard 1/2

      - name: Every exemption's claim can be made false
        timeout-minutes: 3
        run: node scripts/verify-claims-are-sensitive.mjs

  # The second shard of the sites battery, in its own job so the two run at once.
  #
  # A new job is the one shape the budget rules could not accept: its ceiling is part of
  # `R6`'s comparison, and a recording of a run in which it did not exist has nothing to
  # compare. `--borrow` is no answer either -- v3.52 refused a borrow across a budget.
  # `golden-master/ci-declarations.json` therefore carries a job promise (`R9`) for this
  # one round: it names the job, the ceiling written below, the bound on every step, and
  # why the job exists. It carries no seconds, run id or date, because its writer has
  # watched none of those happen. The first green run measures the job, `R4`/`R5` settle
  # the bounds, and the promise is deleted in the commit that records it.
  sensitivity-shard:
    name: every proved exit can disappear without a word (shard 2 of 2)
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - name: Check out
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Set up Node.js
        timeout-minutes: 3
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        timeout-minutes: 3
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        timeout-minutes: 3
        run: pnpm install --frozen-lockfile

      - name: Install the shells the suite cross-checks against
        timeout-minutes: 6
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      - name: Build (core then cli; cli resolves core's dist)
        timeout-minutes: 3
        run: pnpm build

      # A shard whose files never arrive would be a green job that measured nothing.
      # `verify-sites-are-sensitive.mjs` refuses an empty shard before spawning a child.
      - name: Every proved exit can disappear without a word (shard 2 of 2)
        timeout-minutes: 22
        run: node scripts/verify-sites-are-sensitive.mjs --shard 2/2

  # The injection batteries. This is the long pole -- everything else in the workflow
  # fits in two minutes -- so it gets its own job and its own budget.
  #
  # Measured: 746 s of steps on 5dcabae61 and 1092 s on 637d11494, where the old
  # single job's 20-minute budget was exhausted mid-step. The 30-minute budget is
  # above the worst measurement with room for a slower runner, and the workflow's wall
  # clock is now bounded by this job rather than by the sum of every step.
  batteries:
    name: injection batteries, one step each (no survivors, no inert)
    runs-on: ubuntu-latest
    # 25 rather than 30, and the reduction is the arithmetic rather than a saving: a
    # job's budget has to hold the bounds of its own steps, and a bound is twice the
    # measurement. What is left here measures 674 s (11 min) and its longest bound
    # expires at 14 min, so 25 is 11 minutes of room that CI can actually spend --
    # where 30 held a bound that could not fire before the job did.
    timeout-minutes: 25
    steps:
      - name: Check out
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Set up Node.js
        timeout-minutes: 3
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        timeout-minutes: 3
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        timeout-minutes: 3
        run: pnpm install --frozen-lockfile

      - name: Install the shells the suite cross-checks against
        timeout-minutes: 6
        # `check-no-unsafe-shell.test.ts` compares the gate's rule against what
        # `zsh` and `bash` actually do with the same string, which is the
        # strongest acceptance criterion in the tree: the thing being modelled is
        # installed, so the verdict is a measurement rather than a reading of a
        # spec.
        #
        # `bash` is on the runner; `zsh` is not, and the workflow never installed
        # it. The fixture therefore passed here and failed on `ubuntu-24.04`
        # (finding 130): a missing binary produced `status: null` from spawnSync,
        # and `null !== 0` read that as "zsh rejected it". The fixture now reports
        # the missing binary honestly, which is why this step exists rather than
        # an exemption for the runner.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      - name: Build (core then cli; cli resolves core's dist)
        timeout-minutes: 3
        run: pnpm build

      - name: Scorer stability battery (no survivors, no inert mutations)
        timeout-minutes: 3
        run: node scripts/inject-stability.mjs

      # The `component` rule battery, for the same reason as the one above and
      # with a sharper history. Finding 75's assertions were written three times:
      # the first asserted a literal against an identical literal, the second a
      # count with a `>=` bound, and only the third -- a contrast between the
      # rule's behaviour on right and wrong answers -- could be mutated at all.
      # Each rewrite was driven by this battery reporting SURVIVED, so it is the
      # reason the assertions are load-bearing rather than decorative.
      - name: Component rule battery (no survivors, no inert mutations)
        timeout-minutes: 3
        run: node scripts/inject-component-rule.mjs

      # The M1-ceiling probe reports the number the milestone's exit condition is
      # read against, so it is held to the same standard as any other figure this
      # repository publishes: it must move when what it measures moves. The probe
      # partitions the ground truth into recoverable and unrecoverable components
      # and reports the strict ceiling under two definitions; the battery drives
      # both halves of that, and its partition guard is what makes an injection
      # which lets the two halves disagree fail rather than print a tidy number.
      - name: M1-ceiling probe battery (no survivors, no inert mutations)
        timeout-minutes: 3
        run: python3 scripts/injection/m1-ceiling-probe.py

      # The second half of the same standard, applied to the assertions about the
      # probe rather than to the probe. Its first run had three survivors and two
      # misclassified mutations: `failed > 0` counts a suite that never ran as a
      # survivor, because zero failures is also what a passing suite reports. A
      # mutation the runner cannot survive and a mutation nothing detects must not
      # print the same word, so the battery now reads the total test count.
      - name: M1-ceiling probe test battery (no survivors, no inert mutations)
        timeout-minutes: 3
        run: node scripts/inject-m1-ceiling-tests.mjs


      # Every gate, emptied and watched.
      #
      # `docs/progress.md`'s third clause is that a gate with no test is neither a
      # threshold nor an enumeration, and the tracking row for this item read
      # "partially complete (3 of 8 gates)" for several rounds. That number counted
      # a mechanism -- the gates carrying a dedicated block in
      # `gates-are-testable.test.ts` -- while the criterion is broader. Measured as
      # written, by inserting `process.exit(0)` into each gate and running the tests
      # that name it, all of them are caught. This step is what keeps that true: a
      # gate that can be emptied without a test noticing, or that no test names at
      # all, fails the build.
      - name: Every gate can be shown to fail
        timeout-minutes: 9
        run: node scripts/verify-gates-are-testable.mjs

      # The three batteries below were written, repaired, and never invoked. Each
      # has carried a restore verdict since finding 142, and each was green when
      # run by hand -- which is exactly why nobody noticed that no job, and no
      # package script, named any of them. The repair was verifiable only by
      # whoever remembered to type its path, so the guard that holds it
      # (`batteries-verify-their-restore.test.ts`) had to read them statically and
      # records a blind spot for one of them as a result.
      #
      # Wiring them exposed a second defect in the same family as finding 147, and
      # it is the reason they could not simply be added. All three read the
      # runner's summary out of the captured text, and none of them stripped the
      # ANSI escapes the runner emits, so on CI every injection would have been
      # reported as MISSED -- the battery blaming its own suite for a reader that
      # could not see the number. Two of the three did it by walking lines and
      # testing `startswith("Tests ")`, which is false when the line begins with
      # `\x1b[2m`. Measured against the captured bytes in
      # `battery-summary-survives-ci-output.test.ts`, alongside the two readers
      # finding 147 fixed.
      - name: Fault-extraction scoring battery (no survivors)
        timeout-minutes: 3
        run: python3 scripts/injection/fault-extraction-scoring.py

      - name: Fault-extraction workflow battery (no survivors, negative control)
        timeout-minutes: 3
        run: python3 scripts/injection/fault-extraction-workflow.py

      - name: Fetch-official retry battery (no survivors)
        timeout-minutes: 4
        run: python3 scripts/injection/fetch-official-retry.py

      # The five gate scripts above are covered by CI *running* them against the
      # real tree, which proves they do not crash and proves nothing about
      # whether they would refuse. That is a weaker claim than a test that forces
      # them to fail, and this battery is what converts the one into the other:
      # each injection removes a specific guard from a gate and requires the
      # gate's own test file to go red. It found two things the tests could not
      # have -- a dead branch in `check-readme-sample.mjs` whose comment promised
      # a guarantee no input can reach, and a walk guard in
      # `gen-rcaeval-cases.mjs` that is redundant with the try/catch below it.
      # Both are reported rather than papered over; the redundant one is listed
      # in the battery's `EXPECTED_SURVIVORS` with its reason, and the run fails
      # if it ever turns into a genuine survivor.
      - name: Gate-test battery (each gate's test provably fails when its guard is removed)
        timeout-minutes: 7
        run: python3 scripts/injection/gate-tests-battery.py

      # `check-doc-counts.mjs` read three shapes of a published count while the
      # document used more, and the difference was invisible: a shape a reader
      # cannot see is indistinguishable from a shape that is not there, so rules
      # 1 to 3 simply did not apply to 63 of the 88 rows that publish a count.
      # One of the skipped rows had published the whole workspace's number under
      # the label `core` since the pass that wrote it (finding 153). This battery
      # mutates each part of the fix -- the two added shapes, the gate on the bare
      # shape, rule 4, the exemption table's own validation, and the clause key --
      # and requires the gate's test file to go red *on the named assertion*.
      # Its first run reported one SURVIVED, and the mutation was right: the test
      # that claimed to pin the added shape only asserted exit 0, which the bare
      # shape also satisfies, so the file count was read but never used.
      - name: Doc-count shape battery (no survivors, no inert, no misattributed mutations)
        timeout-minutes: 3
        run: python3 scripts/injection/doc-counts-shapes.py


      # The fourth anchor's path now runs on the real corpus: run 38250480271
      # round-tripped 375 of 375 RE1 cases at oracle=1.00. This battery keeps the
      # guard that records it from decaying the way the previous number did --
      # 'the pass count is still Pass 31's 253 of 375' stood in the present tense
      # for two passes after the corpus started passing, because the number lived
      # in a log line and the sentence lived in a document and nothing joined them.
      # Seventeen injections: the record's provenance, the corpus partition, the
      # pins against the registry in both directions, and each of the document's
      # four figures -- plus one that puts back the guard's own first defect, which
      # scoped the document by any line mentioning the section and so read the
      # headline table's cross-reference instead of the section.
      - name: Round-trip record battery (no survivors, no inert, no misattributed mutations)
        timeout-minutes: 3
        run: python3 scripts/injection/roundtrip-record.py

      # The battery's verdicts, published to a branch so they can be read from
      # anywhere the API is.
      #
      # This step exists because the failure it belongs to could not be read. The
      # battery was green locally on every run and red in CI on every run, and the
      # channel that would have said which injection diverged was not reachable:
      # `GET /actions/jobs/{id}/logs` redirects to a storage host this project's
      # proxy blocks (finding 55). Uploading the report as an artifact moved the
      # problem rather than solving it -- the artifact is *listed* through the API
      # and its `zip` endpoint redirects to that same blocked host, measured at
      # 1152 bytes and `http=000`.
      #
      # Git objects are the one channel that is both reachable and carries
      # content, because `api.github.com` serves them itself. So the report is
      # committed to the orphan `ci-reports` branch, never to `master`: it is CI
      # output, it is overwritten every run, and it must not land in the tree the
      # other gates read.
      #
      # `if: always()` is the load-bearing part. A report published only on
      # success is a report about the case that needs no explanation; every
      # question this answers is about a run that failed.
      - name: Publish the gate-test battery report
        timeout-minutes: 3
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/publish-battery-report.py

      # The same report as a downloadable artifact, for a human reading the run
      # page. Redundant with the branch above on purpose and cheap -- the branch is
      # for this project's development environment, the artifact is for the UI.
      - name: Upload the gate-test battery report
        timeout-minutes: 3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-tests-battery-report
          path: gate-tests-battery-report.json
          if-no-files-found: warn
          retention-days: 14

      # The scorer-stability gate is only worth its green if it would refuse a
      # scorer that lost a stability property. Four of its properties were
      # previously unfalsifiable -- the fixture could not exhibit the failure they
      # looked for -- so this battery mutates the built scorer and requires the gate
      # to name the property that broke. See finding 83.
      - name: Scorer-stability probe battery (the stability gate refuses a broken scorer)
        timeout-minutes: 3
        run: python3 scripts/injection/scorer-stability-probe.py



  # The artefacts and the documents: a different kind of check (files and prose rather
  # than behaviour) and a different clock, which is why it is a third job.
  #
  # Measured: 16 s of steps on 5dcabae61. The budget is for the same reason as the
  # others -- a hang is reported as a budget.
  artefacts:
    name: golden master / official metric / examples / documents
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history, because `check-repository-table` resolves the revision its
      # `Commits` row names. The default checkout is one commit, so `e22e2de` was
      # a revision this job did not have and the guard refused the row -- on the
      # runner only, for four rounds, while every local run was green because a
      # developer's clone holds the whole history (finding 530).
      #
      # The cost is the whole repository's history, and this repository is source
      # and documents: 536 commits of it. `docs-guards-need-history.test.ts`
      # refuses a job that runs a docs guard with the default depth, so the two
      # cannot drift apart again.
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the shells the suite cross-checks against
        # `check-no-unsafe-shell.test.ts` compares the gate's rule against what
        # `zsh` and `bash` actually do with the same string, which is the
        # strongest acceptance criterion in the tree: the thing being modelled is
        # installed, so the verdict is a measurement rather than a reading of a
        # spec.
        #
        # `bash` is on the runner; `zsh` is not, and the workflow never installed
        # it. The fixture therefore passed here and failed on `ubuntu-24.04`
        # (finding 130): a missing binary produced `status: null` from spawnSync,
        # and `null !== 0` read that as "zsh rejected it". The fixture now reports
        # the missing binary honestly, which is why this step exists rather than
        # an exemption for the runner.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      - name: Build (core then cli; cli resolves core's dist)
        run: pnpm build

      - name: Golden Master verification
        run: node golden-master/verify.mjs

      - name: Official-metric regression on the shipped example
        run: pnpm official:check

      - name: Examples and site data are up to date
        run: pnpm examples:check

      # `pnpm docs:check` rather than the guards named one at a time. The job
      # used to list them by hand, which made the aggregate script a local-only
      # channel: a guard added to `docs:check` ran on every developer machine and
      # in no pipeline. That is this project's recurring mistake again -- a
      # check that is present, green, and absent from the place it matters.
      # Routing through the script means the next guard added there is wired in
      # by construction instead of by remembering this file.
      - name: Documentation guards are satisfied
        run: pnpm docs:check

      - name: Example pack is up to date
        run: pnpm examples:bundle:check

      - name: Example pack is readable by tar and matches the repository
        run: |
          set -eu
          tar -tzf site/assets/rca-bench-factory-examples.tar.gz
          rm -rf /tmp/example-pack
          mkdir -p /tmp/example-pack
          tar -xzf site/assets/rca-bench-factory-examples.tar.gz -C /tmp/example-pack
          diff -r /tmp/example-pack/rca-bench-factory-examples/examples/order-prod examples/order-prod
          sh -n /tmp/example-pack/rca-bench-factory-examples/run.sh

      - name: Example pack verifies against its own manifest
        run: node scripts/verify-example-pack.mjs

  # The job that starts where a reader starts.
  #
  # ## Why this exists
  #
  # `typecheck` was green for months because the `verify` job above runs `Build`
  # before `Type-check`, so the step was satisfied by the step above it. That was
  # fixed with a `pretypecheck` hook, and the fix was real -- but the defect was
  # never "one script is missing a hook". It was **the job's step order acting as
  # a precondition nobody wrote down**, and repairing the single script that had
  # been observed to break left the rest of the chain resting on it.
  #
  # Measured on a worktree with `pnpm install` and no `pnpm build`, before the
  # hooks were added: `docs:check` failed on its first guard
  # (`Cannot find module '.../packages/core/dist/index.js'`), `lint` failed in
  # `verify-scorer-stability`, and `test`, `test:coverage`, `examples:check` and
  # `official:check` all failed. Three of the seven doc guards read a build
  # artefact -- one imports core's `dist/index.js`, two drive cli's
  # `dist/main.js` -- and a single `pnpm build` made every one of them pass.
  #
  # ## Why it does not build
  #
  # A `pnpm build` step here would make this job green and measure nothing: it
  # would restore exactly the property that hid the defect. So the job installs
  # and runs the chain, and every script it calls has to satisfy its own
  # precondition through the hooks in `package.json`. `cold-tree-job.test.ts`
  # asserts the absence of a build step here, because "make the red job green"
  # is a temptation the next person will feel and a build is the obvious way.
  #
  # ## Why it is a job and not a step
  #
  # As a step inside `verify` it would inherit the build above it and observe
  # nothing. It also runs fewer things on purpose: the mutation batteries and the
  # example-pack round trip answer questions about a built artefact, not about
  # whether a script can find its own inputs, so duplicating them here would cost
  # minutes and add no signal.

  cold-tree:
    name: cold tree / no build / every precondition declared
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `contents: read` is the default and it is all this job needs. Stated rather
    # than inherited because the sibling job above grants `contents: write` for
    # one step, and a reader comparing the two should not have to work out
    # whether this one inherited it.
    permissions:
      contents: read
    steps:
      # Full history for the same reason as the job above: `docs:check:cold`
      # contains `check-repository-table`, whose `Commits` row names a revision
      # and refuses one that does not resolve (finding 530).
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the shells the suite cross-checks against
        # `check-no-unsafe-shell.test.ts` compares the gate's rule against what
        # `zsh` and `bash` actually do with the same string, which is the
        # strongest acceptance criterion in the tree: the thing being modelled is
        # installed, so the verdict is a measurement rather than a reading of a
        # spec.
        #
        # `bash` is on the runner; `zsh` is not, and the workflow never installed
        # it. The fixture therefore passed here and failed on `ubuntu-24.04`
        # (finding 130): a missing binary produced `status: null` from spawnSync,
        # and `null !== 0` read that as "zsh rejected it". The fixture now reports
        # the missing binary honestly, which is why this step exists rather than
        # an exemption for the runner.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      # No build step, here or anywhere below. See the job comment.
      #
      # ## Why the steps are what they are
      #
      # This job used to call `pnpm docs:check`, `lint`, `test`, `examples:check`
      # and `examples:bundle:check`. Combined with the `pre*` hooks in
      # `package.json`, that made the job **build six times** -- measured as six
      # `tsc -p tsconfig.json` invocations in run #174's own log -- because every
      # one of those scripts carries `"pre<script>": "pnpm build"`. A job whose
      # stated purpose is that it has never been built was building on its first
      # step, and the flake it produced (a script spawning mid-`tsc`, dying at
      # link time on whichever module the compiler had not reached yet) was
      # attributed to four different modules across four runs.
      #
      # So the job now runs the scripts that were **measured green with
      # `packages/*/dist` absent**, and nothing else. `cold-tree-job.test.ts`
      # derives that set from the measurements rather than trusting this list --
      # a hand-written list of what is cold-safe is where the next omission will
      # be, which is exactly how `examples:bundle:check` came to be assumed
      # cold-safe when it is not.
      #
      # `--ignore-scripts` is deliberately **not** used. It suppresses `install`
      # and `prepare` scripts and does **not** suppress `pre`/`post` lifecycle
      # hooks -- measured: `pnpm --ignore-scripts typecheck` on a cold tree still
      # ran `pretypecheck`, still ran `tsc`, and still wrote 18 files into
      # `dist/`. The flag that does suppress them is
      # `--config.enable-pre-post-scripts=false`, and the steps below use it, so
      # "no build" is a property of the step rather than of a reader's belief.

      - name: Documentation guards that read no build artefact
        # `docs:check:cold` is an aggregate in `package.json`, for the same
        # reason `docs:check` is one: naming guards individually here makes the
        # list hand-maintained, and a guard added to the cold-safe set later
        # would be wired in by memory. `ci-reaches-doc-guards.test.ts` forbids
        # that shape, and it is right to -- so the cold subset is a first-class
        # aggregate and this step calls it.
        #
        # The four members are the ones measured green with no `dist/`. The other
        # three members of `docs:check` -- `check-readme-sample`,
        # `check-cli-reference`, `check-user-guide` -- import core's
        # `dist/index.js` or drive cli's `dist/main.js` and belong to the warm
        # job, which runs the full aggregate.
        #
        # `--config.enable-pre-post-scripts=false` because `docs:check:cold`
        # deliberately has no `pre*` hook -- that is what makes it cold-safe --
        # and the flag guarantees no hook is added later without this step
        # failing `cold-tree-job.test.ts`.
        run: pnpm --config.enable-pre-post-scripts=false docs:check:cold

      - name: Lint guards that read no build artefact
        # Six of the seven members of `lint`, as a first-class aggregate for the
        # same reason. The seventh, `verify-scorer-stability.mjs`, imports core's
        # built `dist/fault/extraction-scoring.js` and runs in the warm job.
        run: pnpm --config.enable-pre-post-scripts=false lint:cold

      - name: The rule that decides which scripts may run here
        # The behavioural half of the cold-tree rule, run first.
        #
        # It was measured that the suite as a whole is not cold-safe: on a tree
        # with `packages/*/dist` absent, `pnpm test` fails **173 tests across 19
        # files**, and the failing set is exactly the tests that drive the
        # build-dependent scripts plus everything downstream of them. So the job
        # does not run the suite; it runs the scripts that were measured
        # cold-safe, and this file is what keeps "measured" honest.
        #
        # `--config.enable-pre-post-scripts=false` so a future `pretest` cannot
        # build the tree out from under the step that exists to run without one.
        run: pnpm --config.enable-pre-post-scripts=false exec vitest run --root packages/core cold-tree-preconditions.test.ts cold-tree-job.test.ts

  # The two batteries that rewrite a probe a hundred times, split out of `batteries`.
  #
  # The split is arithmetic, not taste. A step bound is twice the step's measurement,
  # and a job's budget has to hold its own bounds. Measured on 41637098008 from the API,
  # the batteries job's steps summed to 1575 s: the type-miss battery 479 s and the
  # backend-support battery 416 s, so their bounds alone are 16 + 14 = 30 minutes in a
  # job that has 30, before any other step is counted. `check-ci-budget.mjs` refuses
  # exactly that -- "its bound expires at 31 min -- past the job's 30" -- and the honest
  # answer to a bound that cannot fire is another bucket rather than a bigger one. The
  # same reading is in finding 166 and finding 206 twice over: a budget shared by steps
  # whose costs differ by an order of magnitude is a budget blamed on the wrong one.
  #
  # What is left behind measures 674 s and what is here measures 914 s, so the wall clock
  # the run waits for is the longer of the two rather than their sum.
  batteries-heavy:
    name: injection batteries, the two that rewrite a probe a hundred times
    runs-on: ubuntu-latest
    # 914 s measured, 22 min for the bound chain, 25 declared -- and 27 from v3.55, when
    # the deadline started counting the prefix at its slowest recorded day: the 15-minute
    # backend-support bound plus 632 s in front of it is 1532 s, which is 25.5 minutes and
    # does not fit in 25. 27 is that deadline rounded up to the next whole minute plus one,
    # which is the smallest amount of room the workflow's unit can express.
    timeout-minutes: 27
    steps:
      - name: Check out
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Set up Node.js
        timeout-minutes: 3
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        timeout-minutes: 3
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        timeout-minutes: 3
        run: pnpm install --frozen-lockfile

      # `backend-support.py` runs targeted vitest invocations, and every job that runs
      # vitest installs the shells its fixtures spawn -- the equality in
      # `cold-tree-job.test.ts` asks for that of a job rather than of the job the rule was
      # written about, which is how this step was found missing here.
      - name: Install the shells the suite cross-checks against
        timeout-minutes: 6
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      - name: Build (core then cli; cli resolves core's dist)
        timeout-minutes: 3
        run: pnpm build

      # The `type`-miss classifier reports the partition that decides whether the
      # `type` shortfall is a scoring defect or a capability limit, so it is the
      # figure the milestone's next round is planned against. Its battery is the
      # first here whose injections are *paired*: four of them are only decidable
      # as a definition edit plus the data edit that makes the definition
      # observable, and the pair is expressed as an `also` slot rather than as a
      # comment describing one. A battery that asserts half a pair and describes
      # the other half reports SURVIVED, correctly, and says nothing.
      #
      # Three ways an injection can fail to test anything, all three fatal. A
      # SURVIVED mutation left the requirement true. An INERT one never applied.
      # BLIND is the one this battery learned the hard way: the edit applied to
      # the recorded answers but the published partition did not move at all, so
      # the anchor was on a row the edit could not reclassify -- the requirement
      # went False and the run looked caught while the probe's actual decision had
      # not been exercised. It is checked for data-only injections, where "the
      # partition must move" is the whole point of the edit.
      # 530 s on run 41749989956, so twice is 1060 and the bound is 18 -- the same
      # arithmetic as every other bound here, applied to a measurement that had moved.
      - name: Type-miss probe battery (no survivors, no inert, no blind mutations)
        timeout-minutes: 18
        run: python3 scripts/injection/type-miss-probe.py

      # P1-5 asks for T2's six backends to be measured and the unsupported ones
      # declared. That declaration has three links -- the document matrix, the
      # derived snapshot, and the registry that says which backend has a pull
      # path -- and this battery removes one link at a time: seven refusals from
      # the document guard, the stale-snapshot branch of the derive script, six
      # branches of the wire reader, and the registry's agreement with its own
      # snapshot. Its first run reported one INERT, which is the outcome the
      # vocabulary exists for: the anchor had the wrong indentation, so nothing
      # was mutated, and a mutation that never applied is not evidence about
      # anything.
      - name: Backend-support battery (no survivors, no inert, no misattributed mutations)
        timeout-minutes: 15
        run: python3 scripts/injection/backend-support.py
