name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    name: typecheck / lint / test / coverage / mutation / golden-master / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (core then cli; cli resolves core's dist)
        run: pnpm build

      - name: Type-check
        run: pnpm typecheck

      - name: Lint (no mock / no secrets)
        run: pnpm lint

      - name: Test with coverage (core + cli, ≥95% per dimension, 100% functions)
        run: pnpm test:coverage

      - name: Mutation suite (gate + export, 100% interception)
        run: pnpm exec vitest run --root packages/core mutation.test.ts

      - name: Golden Master verification
        run: node golden-master/verify.mjs

      - name: Official-metric regression on the shipped example
        run: pnpm official:check

      - name: Examples and site data are up to date
        run: pnpm examples:check

      - name: README usage sample runs against the built package
        run: node scripts/check-readme-sample.mjs

      - name: CLI reference matches the built binary
        run: node scripts/check-cli-reference.mjs

      - name: Example pack is up to date
        run: pnpm examples:bundle:check

      - name: Example pack is readable by tar and matches the repository
        run: |
          set -eu
          tar -tzf site/assets/rca-bench-factory-examples.tar.gz
          rm -rf /tmp/example-pack
          mkdir -p /tmp/example-pack
          tar -xzf site/assets/rca-bench-factory-examples.tar.gz -C /tmp/example-pack
          diff -r /tmp/example-pack/rca-bench-factory-examples/examples/order-prod examples/order-prod
          sh -n /tmp/example-pack/rca-bench-factory-examples/run.sh
          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const root = "/tmp/example-pack/rca-bench-factory-examples";
            const m = JSON.parse(fs.readFileSync(root + "/MANIFEST.json", "utf8"));
            for (const e of m.entries) {
              const b = fs.readFileSync(root + "/" + e.path);
              if (b.length !== e.bytes) throw new Error("size mismatch: " + e.path);
              const digest = crypto.createHash("sha256").update(b).digest("hex");
              if (digest !== e.sha256) throw new Error("digest mismatch: " + e.path);
            }
            // The manifest lists content files and cannot list itself, so the
            // tree holds one more file than m.fileCount. Compare against the
            // tree rather than printing a number nobody can check.
            const walk = (d) => fs.readdirSync(d, { withFileTypes: true })
              .flatMap((x) => x.isDirectory() ? walk(d + "/" + x.name) : [d + "/" + x.name]);
            const present = walk(root).map((p) => p.slice(root.length + 1));
            const listed = new Set([...m.entries.map((e) => e.path), "MANIFEST.json"]);
            const unlisted = present.filter((p) => !listed.has(p));
            if (unlisted.length) throw new Error("unlisted file: " + unlisted.join(", "));
            if (m.archiveFileCount !== present.length) {
              throw new Error("archiveFileCount says " + m.archiveFileCount + " but the tree holds " + present.length);
            }
            console.log(present.length + " packed files verified against MANIFEST.json");
          '
